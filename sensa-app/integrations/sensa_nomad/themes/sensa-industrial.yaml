# Sensa Industrial — Home Assistant theme bundled with Sensa Nomad.
#
# Moody graphite + brushed-aluminium aesthetic with industrial teal
# (primary) and rust orange (accent). Palette derived from the
# Blackpaw Industrial theme by Blackpaw Studios.
#
# Architecture rule: this theme MAY define internal `--sensa-ind-*`
# palette vars for its own use, but every Sensa-generated dashboard
# and webcard MUST reference HA-standard theme variables only
# (--primary-color, --accent-color, --warning-color, --error-color,
# --success-color, --info-color, --card-background-color, etc.).
# Switching to this theme should style every Sensa surface without
# any code changes.
#
# Differences vs. the source Blackpaw theme:
#   * No card-mod block — card-mod is a HACS dependency, not an
#     HA-standard theme variable. Solid card backgrounds are achieved
#     via `card-background-color` directly.
#   * Modern `switch-*` variable names instead of legacy
#     `paper-toggle-button-*`.
#   * Adds warning / error / success / info colours that the source
#     theme omitted, so Sensa cards & dashboards (which reference
#     those HA-standard names) render correctly.

Sensa Industrial:
  # ---- Internal industrial palette (only used inside this theme) ---
  sensa-ind-aluminium:   "#b7b7b8"
  sensa-ind-graphite-0:  "#0f1013"
  sensa-ind-graphite-1:  "#1a1c20"
  sensa-ind-graphite-2:  "#222329"
  sensa-ind-graphite-3:  "#2a2b2f"
  sensa-ind-section:     "#1d1f24"
  sensa-ind-text:        "#e8e9ed"
  sensa-ind-text-dim:    "#b9bdc6"
  sensa-ind-teal:        "#5491a4"
  sensa-ind-orange:      "#bb452e"

  # ---- Primary identity --------------------------------------------
  primary-color:        "var(--sensa-ind-teal)"
  accent-color:         "var(--sensa-ind-orange)"
  dark-primary-color:   "var(--sensa-ind-graphite-3)"
  light-primary-color:  "var(--sensa-ind-teal)"

  # ---- Surfaces -----------------------------------------------------
  primary-background-color:        "var(--sensa-ind-graphite-0)"
  secondary-background-color:      "var(--sensa-ind-graphite-1)"
  card-background-color:           "var(--sensa-ind-graphite-1)"
  ha-card-background:              "var(--sensa-ind-graphite-1)"
  paper-card-background-color:     "var(--sensa-ind-graphite-1)"
  paper-listbox-background-color:  "var(--sensa-ind-graphite-2)"
  paper-dialog-background-color:   "var(--sensa-ind-graphite-2)"
  paper-tooltip-background-color:  "var(--sensa-ind-graphite-3)"
  scrollbar-thumb-color:           "var(--sensa-ind-graphite-3)"

  # ---- Card chrome --------------------------------------------------
  ha-card-border-radius:   "8px"
  ha-card-border-color:    "rgba(255, 255, 255, 0.12)"
  ha-card-border-width:    "1px"
  ha-card-box-shadow:      "0 8px 24px rgba(0, 0, 0, 0.45)"
  ha-badge-border-radius:  "8px"

  # ---- Text ---------------------------------------------------------
  primary-text-color:     "var(--sensa-ind-text)"
  secondary-text-color:   "var(--sensa-ind-text-dim)"
  # The label painted ON a filled accent (sa-primary, sa-danger, the
  # selection bar). NOT the body ink: that is `primary-text-color`, one
  # letter-order away and the opposite colour. A dark theme's accents are
  # LIGHT, so the label on them is dark, not the theme's own light text.
  text-primary-color:     "#000000"
  disabled-text-color:    "rgba(232, 233, 237, 0.45)"
  text-light-color:       "var(--sensa-ind-text)"
  text-dark-color:        "#0b1215"

  # ---- Dividers / borders ------------------------------------------
  divider-color:  "rgba(255, 255, 255, 0.10)"
  outline-color:  "rgba(255, 255, 255, 0.10)"

  # ---- App header ---------------------------------------------------
  app-header-background-color:       "var(--sensa-ind-graphite-2)"
  app-header-text-color:             "var(--sensa-ind-text)"
  app-header-edit-background-color:  "var(--sensa-ind-graphite-2)"
  app-header-selection-bar-color:    "var(--sensa-ind-teal)"

  # ---- Sidebar ------------------------------------------------------
  sidebar-background-color:           "var(--sensa-ind-graphite-2)"
  sidebar-text-color:                 "var(--sensa-ind-text-dim)"
  sidebar-icon-color:                 "var(--sensa-ind-text-dim)"
  sidebar-selected-text-color:        "var(--sensa-ind-teal)"
  sidebar-selected-icon-color:        "var(--sensa-ind-teal)"
  sidebar-selected-background-color:  "rgba(255, 255, 255, 0.06)"

  # ---- State icons --------------------------------------------------
  paper-item-icon-color:         "var(--sensa-ind-text-dim)"
  paper-item-icon-active-color:  "var(--sensa-ind-teal)"
  state-icon-color:              "var(--sensa-ind-text-dim)"
  state-icon-active-color:       "var(--sensa-ind-teal)"

  # ---- Domain state colours ----------------------------------------
  state-active-color:                "var(--sensa-ind-teal)"
  state-inactive-color:              "var(--sensa-ind-text-dim)"
  state-binary_sensor-active-color:  "var(--sensa-ind-teal)"
  state-light-active-color:          "#cf8a3a"
  state-switch-active-color:         "var(--sensa-ind-teal)"
  state-climate-heat-color:          "var(--sensa-ind-orange)"
  state-climate-cool-color:          "var(--sensa-ind-teal)"

  # ---- Switch / toggle ---------------------------------------------
  switch-checked-color:           "var(--sensa-ind-teal)"
  switch-checked-button-color:    "var(--sensa-ind-teal)"
  switch-checked-track-color:     "rgba(84, 145, 164, 0.45)"
  switch-unchecked-button-color:  "#c9cdd6"
  switch-unchecked-track-color:   "rgba(255, 255, 255, 0.18)"

  # ---- Slider -------------------------------------------------------
  paper-slider-knob-color:         "var(--sensa-ind-teal)"
  paper-slider-knob-start-color:   "var(--sensa-ind-teal)"
  paper-slider-pin-color:          "var(--sensa-ind-teal)"
  paper-slider-active-color:       "var(--sensa-ind-teal)"
  paper-slider-secondary-color:    "var(--sensa-ind-orange)"
  paper-slider-container-color:    "rgba(255, 255, 255, 0.20)"

  # ---- Legacy paper-input vars (older form widgets) ----------------
  input-background-color:    "var(--sensa-ind-graphite-2)"
  input-fill-color:          "var(--sensa-ind-graphite-2)"
  input-ink-color:           "var(--sensa-ind-text)"
  input-label-ink-color:     "var(--sensa-ind-text-dim)"
  input-idle-line-color:     "rgba(255, 255, 255, 0.12)"
  input-hover-line-color:    "var(--sensa-ind-teal)"
  input-disabled-ink-color:  "rgba(232, 233, 237, 0.45)"

  # ---- HA design tokens (THIS is what modern HA actually reads) ----
  # Current HA frontend (config flow, profile prefs, dialogs, helpers)
  # uses webawesome `wa-input` / `wa-select` components styled via the
  # `--ha-color-*` design-token system, NOT the legacy MDC vars below.
  # The wa-input mixin reads `--ha-color-form-background` directly for
  # input fill — without this override, HA's default light theme value
  # (`--ha-color-neutral-95` ≈ #f3f3f3) wins and inputs render as
  # near-white boxes regardless of how dark `--card-background-color`
  # or the MDC vars are. HA's own dark theme overrides these in a
  # separate `darkSemanticColorStyles` block; custom dark theme YAMLs
  # have to override them explicitly.
  # Reference: home-assistant/frontend src/resources/theme/color/semantic.globals.ts

  # Forms — input field fills (text, password, number, select)
  ha-color-form-background:           "var(--sensa-ind-graphite-2)"
  ha-color-form-background-hover:     "var(--sensa-ind-graphite-3)"
  ha-color-form-background-disabled:  "var(--sensa-ind-graphite-1)"

  # Text on the default surface
  ha-color-text-primary:    "var(--sensa-ind-text)"
  ha-color-text-secondary:  "var(--sensa-ind-text-dim)"
  ha-color-text-disabled:   "rgba(232, 233, 237, 0.45)"
  ha-color-text-link:       "var(--sensa-ind-teal)"

  # Page surfaces (cards, dialogs, sidebar variants)
  ha-color-surface-default:     "var(--sensa-ind-graphite-1)"
  ha-color-surface-low:         "var(--sensa-ind-graphite-0)"
  ha-color-surface-lower:       "#000000"
  ha-color-on-surface-default:  "var(--sensa-ind-text)"

  # Neutral borders
  ha-color-border-neutral-quiet:   "rgba(255, 255, 255, 0.10)"
  ha-color-border-neutral-normal:  "rgba(255, 255, 255, 0.18)"
  ha-color-border-neutral-loud:    "rgba(255, 255, 255, 0.30)"

  # Status fills (alerts, validation states, badges)
  ha-color-fill-danger-loud-resting:   "#d55243"
  ha-color-fill-warning-loud-resting:  "#cf8a3a"
  ha-color-fill-success-loud-resting:  "#3a9268"
  ha-color-on-danger-quiet:            "#d55243"
  ha-color-on-warning-quiet:           "#cf8a3a"
  ha-color-on-success-quiet:           "#3a9268"

  # Neutral fills — dropdown item hover, chips, neutral buttons.
  # wa-dropdown-item:hover reads --wa-color-neutral-fill-normal which
  # bridges to --ha-color-fill-neutral-normal-resting in wa.globals.ts.
  # HA's light default is --ha-color-neutral-90 (#e6e6e6, near-white)
  # — invisible against our text on hovered dropdown items.
  ha-color-fill-neutral-quiet-resting:   "rgba(255, 255, 255, 0.04)"
  ha-color-fill-neutral-quiet-hover:     "rgba(255, 255, 255, 0.08)"
  ha-color-fill-neutral-quiet-active:    "rgba(255, 255, 255, 0.04)"
  ha-color-fill-neutral-normal-resting:  "rgba(255, 255, 255, 0.08)"
  ha-color-fill-neutral-normal-hover:    "rgba(255, 255, 255, 0.12)"
  ha-color-fill-neutral-normal-active:   "rgba(255, 255, 255, 0.08)"
  ha-color-fill-neutral-loud-resting:    "rgba(255, 255, 255, 0.20)"
  ha-color-fill-neutral-loud-hover:      "rgba(255, 255, 255, 0.28)"
  ha-color-fill-neutral-loud-active:     "rgba(255, 255, 255, 0.20)"

  # Primary fills — selected dropdown item, primary-tinted buttons.
  # ha-dropdown-item[selected] reads --ha-color-fill-primary-quiet-
  # resting directly. Faint industrial-teal tint over the dark
  # surface so the current selection is visually distinct.
  ha-color-fill-primary-quiet-resting:   "rgba(84, 145, 164, 0.14)"
  ha-color-fill-primary-quiet-hover:     "rgba(84, 145, 164, 0.22)"
  ha-color-fill-primary-quiet-active:    "rgba(84, 145, 164, 0.14)"
  ha-color-fill-primary-normal-resting:  "rgba(84, 145, 164, 0.26)"
  ha-color-fill-primary-normal-hover:    "rgba(84, 145, 164, 0.34)"
  ha-color-fill-primary-normal-active:   "rgba(84, 145, 164, 0.26)"

  # Text colours on those fills
  ha-color-on-neutral-quiet:   "var(--sensa-ind-text-dim)"
  ha-color-on-neutral-normal:  "var(--sensa-ind-text)"
  ha-color-on-neutral-loud:    "var(--sensa-ind-text)"
  ha-color-on-primary-quiet:   "var(--sensa-ind-teal)"
  ha-color-on-primary-normal:  "var(--sensa-ind-teal)"
  ha-color-on-primary-loud:    "var(--sensa-ind-text)"

  # Modal / dialog body
  ha-dialog-surface-background:  "var(--sensa-ind-graphite-1)"

  # ---- Legacy MDC text fields (older HA widgets, kept for compat) --
  mdc-text-field-fill-color:                      "var(--sensa-ind-graphite-2)"
  mdc-text-field-disabled-fill-color:             "var(--sensa-ind-graphite-1)"
  mdc-text-field-ink-color:                       "var(--sensa-ind-text)"
  mdc-text-field-label-ink-color:                 "var(--sensa-ind-text-dim)"
  mdc-text-field-disabled-ink-color:              "rgba(232, 233, 237, 0.45)"
  mdc-text-field-disabled-line-color:             "rgba(255, 255, 255, 0.10)"
  mdc-text-field-idle-line-color:                 "rgba(255, 255, 255, 0.12)"
  mdc-text-field-hover-line-color:                "var(--sensa-ind-teal)"
  mdc-text-field-error-line-color:                "#d55243"
  mdc-text-field-error-ink-color:                 "#d55243"
  mdc-text-field-error-label-ink-color:           "#d55243"
  mdc-text-field-outlined-idle-border-color:      "rgba(255, 255, 255, 0.12)"
  mdc-text-field-outlined-hover-border-color:     "var(--sensa-ind-teal)"
  mdc-text-field-outlined-disabled-border-color:  "rgba(255, 255, 255, 0.10)"

  # ---- MDC select / dropdowns --------------------------------------
  mdc-select-fill-color:                       "var(--sensa-ind-graphite-2)"
  mdc-select-disabled-fill-color:              "var(--sensa-ind-graphite-1)"
  mdc-select-ink-color:                        "var(--sensa-ind-text)"
  mdc-select-label-ink-color:                  "var(--sensa-ind-text-dim)"
  mdc-select-disabled-ink-color:               "rgba(232, 233, 237, 0.45)"
  mdc-select-idle-line-color:                  "rgba(255, 255, 255, 0.12)"
  mdc-select-hover-line-color:                 "var(--sensa-ind-teal)"
  mdc-select-dropdown-icon-color:              "var(--sensa-ind-text-dim)"
  mdc-select-outlined-idle-border-color:       "rgba(255, 255, 255, 0.12)"
  mdc-select-outlined-hover-border-color:      "var(--sensa-ind-teal)"
  mdc-select-outlined-disabled-border-color:   "rgba(255, 255, 255, 0.10)"

  # ---- MDC dialog + list (dropdown popups, modal headings) ---------
  mdc-dialog-heading-ink-color:  "var(--sensa-ind-text)"
  mdc-dialog-content-ink-color:  "var(--sensa-ind-text)"
  mdc-dialog-scrim-color:        "rgba(0, 0, 0, 0.6)"
  mdc-list-text-color:           "var(--sensa-ind-text)"

  # ---- Status (NOT in source theme — picked to fit the palette
  #      while staying visually distinct from accent rust orange) ---
  warning-color:  "#cf8a3a"
  error-color:    "#d55243"
  success-color:  "#3a9268"
  info-color:     "var(--sensa-ind-teal)"

  # ---- Material Design Components ----------------------------------
  mdc-theme-primary:      "var(--sensa-ind-teal)"
  mdc-theme-secondary:    "var(--sensa-ind-orange)"
  mdc-theme-background:   "var(--sensa-ind-graphite-0)"
  mdc-theme-surface:      "var(--sensa-ind-graphite-2)"
  mdc-theme-on-primary:   "#0b1215"
  mdc-theme-on-secondary: "#160c09"
  mdc-theme-on-surface:   "var(--sensa-ind-text)"

  # ---- Code blocks --------------------------------------------------
  code-editor-background-color:    "var(--sensa-ind-graphite-2)"
  markdown-code-background-color:  "var(--sensa-ind-graphite-3)"

  # ---- Lovelace page background ------------------------------------
  # Brushed-aluminium effect lifted from the source theme: a darkening
  # gradient + a diagonal sheen + vertical brushed-metal striations
  # over the aluminium base. Pure CSS, no card-mod required.
  lovelace-background: >
    linear-gradient(180deg, rgba(0, 0, 0, 0.56), rgba(0, 0, 0, 0.40)),
    linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(0, 0, 0, 0.10)),
    repeating-linear-gradient(90deg,
      rgba(255, 255, 255, 0.08) 0px, rgba(255, 255, 255, 0.08) 2px,
      rgba(0, 0, 0, 0.05) 2px, rgba(0, 0, 0, 0.05) 6px),
    var(--sensa-ind-aluminium)
