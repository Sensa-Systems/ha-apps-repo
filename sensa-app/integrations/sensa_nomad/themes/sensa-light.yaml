# Sensa Light: the Home Assistant theme bundled with Sensa Nomad.
#
# The white-background member of the bundled set, and the starting
# template for any light theme (dealer or otherwise): copy this file,
# rename the top-level key, and change the internal palette block at
# the top. Nothing below that block should need editing.
#
# Same brand blue as Sensa Colours so the identity carries across, but
# on a near-white page with solid white cards: no glass, no gradients,
# a hairline border and a soft shadow instead. Status colours are the
# DARKENED variants of the brand set, because the Sensa Colours amber
# (#f9a01e) and success (#3ecf8e) are tuned for a navy page and fall
# below usable contrast on white.
#
#
# Light-theme colour rule (the one thing that is NOT free to change when you
# copy this file). It is about LIGHTNESS, not saturation. Sensa Colours' blue
# is #2f7cf6: 92% saturated and 57% light. Over navy that is right. Over white
# it glares, and at 3.94:1 it was the weakest thing in the palette despite
# being the colour every control is tinted with. Desaturating it is the
# tempting fix and it is the wrong one, because it comes back looking washed
# out. Deepening it is the right one. So: keep the hue, allow up to 75%
# saturation, and push the lightness down until the accent clears 4.6:1
# against the page and a white label clears 6:1 on top of it. That last number
# is what takes the glare off. None of this applies to the DARK themes in this
# directory, where a light, saturated accent is correct.
# Architecture rule: this theme MAY define internal `--sensa-lt-*`
# palette vars for its own use, but every Sensa-generated dashboard
# and webcard MUST reference HA-standard theme variables only
# (--primary-color, --accent-color, --warning-color, --error-color,
# --success-color, --info-color, --card-background-color, etc.).
# Switching to this theme should style every Sensa surface without
# any code changes.
#
# Light-theme note: the `--ha-color-*` neutral fills below are DARK
# alpha over a light surface, the mirror of what the two dark themes
# use. Copying a white-alpha value from Sensa Colours into a light
# theme yields an invisible dropdown hover.

Sensa Light:
  # ---- Internal light palette (only used inside this theme) --------
  sensa-lt-page:        "#f4f6f9"   # body / page behind the cards
  sensa-lt-page-2:      "#eaeef4"   # sidebar variants, secondary surfaces
  sensa-lt-page-3:      "#dfe5ed"   # pressed / selected / track
  sensa-lt-card:        "#ffffff"   # cards, dialogs, menus
  sensa-lt-field:       "#f7f9fc"   # input fills
  sensa-lt-line:        "rgba(16, 25, 42, 0.12)"
  sensa-lt-line-loud:   "rgba(16, 25, 42, 0.24)"
  sensa-lt-text:        "#10192a"
  sensa-lt-muted:       "#5a6879"
  sensa-lt-faint:       "#98a3b1"
  # Same hue as Sensa Colours' blue, deepened rather than desaturated: 75%
  # saturation at 44% lightness against the brand's 92% at 57%. Rich enough
  # not to read as washed out, dark enough that a white label on it clears
  # 6:1 and it does not glare against a near-white page.
  sensa-lt-blue:        "#1c5ec6"   # brand hue, deepened for a light page
  sensa-lt-blue-deep:   "#1f4770"   # hover / pressed, and blue text on white
  sensa-lt-amber:       "#9b600a"   # caution, and lights-on
  sensa-lt-heat:        "#bd4622"   # climate heating
  sensa-lt-fault:       "#b9282d"   # something is wrong
  sensa-lt-success:     "#147c54"

  # ---- Primary identity --------------------------------------------
  primary-color:        "var(--sensa-lt-blue)"
  accent-color:         "var(--sensa-lt-blue)"
  dark-primary-color:   "var(--sensa-lt-blue-deep)"
  light-primary-color:  "var(--sensa-lt-page-3)"

  # ---- Surfaces -----------------------------------------------------
  primary-background-color:        "var(--sensa-lt-page)"
  secondary-background-color:      "var(--sensa-lt-page-2)"
  card-background-color:           "var(--sensa-lt-card)"
  ha-card-background:              "var(--sensa-lt-card)"
  paper-card-background-color:     "var(--sensa-lt-card)"
  paper-listbox-background-color:  "var(--sensa-lt-card)"
  paper-dialog-background-color:   "var(--sensa-lt-card)"
  paper-tooltip-background-color:  "var(--sensa-lt-text)"
  scrollbar-thumb-color:           "var(--sensa-lt-page-3)"

  # ---- Card chrome --------------------------------------------------
  # A white card on a near-white page has no edge of its own, so the
  # border does the separating and the shadow only seats it. A dark
  # theme's heavy drop shadow reads as dirt on white.
  #
  # The edge is deliberately a LINE, not a soft gradient: the border is
  # a touch stronger than the theme's general hairline, and the shadow
  # is one tight 2px offset rather than the 16px bloom this had before.
  # On a light page a wide blur does not read as depth, it reads as an
  # out-of-focus card.
  ha-card-border-radius:   "12px"
  ha-card-border-color:    "rgba(16, 25, 42, 0.18)"
  ha-card-border-width:    "1px"
  ha-card-box-shadow:      "0 1px 2px rgba(16, 25, 42, 0.07)"
  ha-badge-border-radius:  "12px"

  # ---- Text ---------------------------------------------------------
  primary-text-color:     "var(--sensa-lt-text)"
  secondary-text-color:   "var(--sensa-lt-muted)"
  text-primary-color:     "#ffffff"
  disabled-text-color:    "var(--sensa-lt-faint)"
  # text-light-color is the text HA paints ON a primary-coloured fill
  # (raised buttons, the selection bar), so on a light theme it stays
  # white while text-dark-color carries the near-black body ink.
  text-light-color:       "#ffffff"
  text-dark-color:        "var(--sensa-lt-text)"

  # ---- Dividers / borders ------------------------------------------
  divider-color:  "var(--sensa-lt-line)"
  outline-color:  "var(--sensa-lt-line)"

  # ---- App header ---------------------------------------------------
  app-header-background-color:       "var(--sensa-lt-card)"
  app-header-text-color:             "var(--sensa-lt-text)"
  app-header-edit-background-color:  "var(--sensa-lt-page-2)"
  app-header-selection-bar-color:    "var(--sensa-lt-blue)"

  # ---- Sidebar ------------------------------------------------------
  sidebar-background-color:           "var(--sensa-lt-card)"
  sidebar-text-color:                 "var(--sensa-lt-muted)"
  sidebar-icon-color:                 "var(--sensa-lt-muted)"
  sidebar-selected-text-color:        "var(--sensa-lt-blue-deep)"
  sidebar-selected-icon-color:        "var(--sensa-lt-blue)"
  sidebar-selected-background-color:  "var(--sensa-lt-page-2)"

  # ---- State icons --------------------------------------------------
  paper-item-icon-color:         "var(--sensa-lt-muted)"
  paper-item-icon-active-color:  "var(--sensa-lt-blue)"
  state-icon-color:              "var(--sensa-lt-muted)"
  state-icon-active-color:       "var(--sensa-lt-blue)"

  # ---- Domain state colours ----------------------------------------
  state-active-color:                "var(--sensa-lt-blue)"
  state-inactive-color:              "var(--sensa-lt-faint)"
  state-binary_sensor-active-color:  "var(--sensa-lt-blue)"
  state-light-active-color:          "var(--sensa-lt-amber)"
  state-switch-active-color:         "var(--sensa-lt-blue)"
  state-climate-heat-color:          "var(--sensa-lt-heat)"
  state-climate-cool-color:          "var(--sensa-lt-blue)"

  # ---- Switch / toggle ---------------------------------------------
  switch-checked-color:           "var(--sensa-lt-blue)"
  switch-checked-button-color:    "var(--sensa-lt-blue)"
  switch-checked-track-color:     "rgba(28, 94, 198, 0.45)"
  switch-unchecked-button-color:  "#ffffff"
  switch-unchecked-track-color:   "var(--sensa-lt-line-loud)"

  # ---- Slider -------------------------------------------------------
  paper-slider-knob-color:         "var(--sensa-lt-blue)"
  paper-slider-knob-start-color:   "var(--sensa-lt-blue)"
  paper-slider-pin-color:          "var(--sensa-lt-blue)"
  paper-slider-active-color:       "var(--sensa-lt-blue)"
  paper-slider-secondary-color:    "color-mix(in srgb, var(--sensa-lt-blue) 40%, transparent)"
  paper-slider-container-color:    "var(--sensa-lt-page-3)"

  # ---- Legacy paper-input vars (older form widgets) ----------------
  input-background-color:    "var(--sensa-lt-field)"
  input-fill-color:          "var(--sensa-lt-field)"
  input-ink-color:           "var(--sensa-lt-text)"
  input-label-ink-color:     "var(--sensa-lt-muted)"
  input-idle-line-color:     "var(--sensa-lt-line)"
  input-hover-line-color:    "var(--sensa-lt-blue)"
  input-disabled-ink-color:  "var(--sensa-lt-faint)"

  # ---- HA design tokens (THIS is what modern HA actually reads) ----
  # Current HA frontend (config flow, profile prefs, dialogs, helpers)
  # uses webawesome `wa-input` / `wa-select` components styled via the
  # `--ha-color-*` design-token system, NOT the legacy MDC vars below.
  # HA's own defaults for these ARE the light values, so a light theme
  # could in principle omit the block. It is set in full anyway so the
  # theme stays self-contained (one palette edit restyles everything)
  # and so this file works as the copy-me template for a light dealer
  # theme, where HA's stock neutral greys would be off-brand.
  # Reference: home-assistant/frontend src/resources/theme/color/semantic.globals.ts

  # Forms: input field fills (text, password, number, select)
  ha-color-form-background:           "var(--sensa-lt-field)"
  ha-color-form-background-hover:     "#ffffff"
  ha-color-form-background-disabled:  "var(--sensa-lt-page-2)"

  # Text on the default surface
  ha-color-text-primary:    "var(--sensa-lt-text)"
  ha-color-text-secondary:  "var(--sensa-lt-muted)"
  ha-color-text-disabled:   "var(--sensa-lt-faint)"
  ha-color-text-link:       "var(--sensa-lt-blue-deep)"

  # Page surfaces (cards, dialogs, sidebar variants). A light theme
  # stacks the OTHER way from the dark ones: "lower" is the deepest
  # tint rather than the darkest, so the page sits below white cards.
  ha-color-surface-default:     "var(--sensa-lt-card)"
  ha-color-surface-low:         "var(--sensa-lt-page)"
  ha-color-surface-lower:       "var(--sensa-lt-page-2)"
  ha-color-on-surface-default:  "var(--sensa-lt-text)"

  # Neutral borders
  ha-color-border-neutral-quiet:   "var(--sensa-lt-line)"
  ha-color-border-neutral-normal:  "var(--sensa-lt-line-loud)"
  ha-color-border-neutral-loud:    "rgba(16, 25, 42, 0.40)"

  # Status fills (alerts, validation states, badges)
  ha-color-fill-danger-loud-resting:   "var(--sensa-lt-fault)"
  ha-color-fill-warning-loud-resting:  "var(--sensa-lt-amber)"
  ha-color-fill-success-loud-resting:  "var(--sensa-lt-success)"
  ha-color-on-danger-quiet:            "var(--sensa-lt-fault)"
  ha-color-on-warning-quiet:           "var(--sensa-lt-amber)"
  ha-color-on-success-quiet:           "var(--sensa-lt-success)"

  # Neutral fills: dropdown item hover, chips, neutral buttons.
  # wa-dropdown-item:hover reads --wa-color-neutral-fill-normal which
  # bridges to --ha-color-fill-neutral-normal-resting in wa.globals.ts.
  # DARK alpha over the light surface, the mirror of what the two dark
  # themes use; a white-alpha value copied from those is invisible.
  ha-color-fill-neutral-quiet-resting:   "rgba(16, 25, 42, 0.03)"
  ha-color-fill-neutral-quiet-hover:     "rgba(16, 25, 42, 0.06)"
  ha-color-fill-neutral-quiet-active:    "rgba(16, 25, 42, 0.03)"
  ha-color-fill-neutral-normal-resting:  "rgba(16, 25, 42, 0.06)"
  ha-color-fill-neutral-normal-hover:    "rgba(16, 25, 42, 0.10)"
  ha-color-fill-neutral-normal-active:   "rgba(16, 25, 42, 0.06)"
  ha-color-fill-neutral-loud-resting:    "rgba(16, 25, 42, 0.16)"
  ha-color-fill-neutral-loud-hover:      "rgba(16, 25, 42, 0.22)"
  ha-color-fill-neutral-loud-active:     "rgba(16, 25, 42, 0.16)"

  # Primary fills: selected dropdown item, primary-tinted buttons.
  # ha-dropdown-item[selected] reads --ha-color-fill-primary-quiet-
  # resting directly. Faint brand-blue wash over white so the current
  # selection reads without turning the row into a solid blue block.
  ha-color-fill-primary-quiet-resting:   "rgba(28, 94, 198, 0.08)"
  ha-color-fill-primary-quiet-hover:     "rgba(28, 94, 198, 0.14)"
  ha-color-fill-primary-quiet-active:    "rgba(28, 94, 198, 0.08)"
  ha-color-fill-primary-normal-resting:  "rgba(28, 94, 198, 0.18)"
  ha-color-fill-primary-normal-hover:    "rgba(28, 94, 198, 0.26)"
  ha-color-fill-primary-normal-active:   "rgba(28, 94, 198, 0.18)"

  # Text colours on those fills. The `-loud` fills are solid, so text
  # on them is white here rather than the body ink.
  ha-color-on-neutral-quiet:   "var(--sensa-lt-muted)"
  ha-color-on-neutral-normal:  "var(--sensa-lt-text)"
  ha-color-on-neutral-loud:    "var(--sensa-lt-text)"
  ha-color-on-primary-quiet:   "var(--sensa-lt-blue-deep)"
  ha-color-on-primary-normal:  "var(--sensa-lt-blue-deep)"
  ha-color-on-primary-loud:    "#ffffff"

  # ---- Legacy MDC text fields (older HA widgets, kept for compat) --
  mdc-text-field-fill-color:                      "var(--sensa-lt-field)"
  mdc-text-field-disabled-fill-color:             "var(--sensa-lt-page-2)"
  mdc-text-field-ink-color:                       "var(--sensa-lt-text)"
  mdc-text-field-label-ink-color:                 "var(--sensa-lt-muted)"
  mdc-text-field-disabled-ink-color:              "var(--sensa-lt-faint)"
  mdc-text-field-disabled-line-color:             "var(--sensa-lt-line)"
  mdc-text-field-idle-line-color:                 "var(--sensa-lt-line)"
  mdc-text-field-hover-line-color:                "var(--sensa-lt-blue)"
  mdc-text-field-error-line-color:                "var(--sensa-lt-fault)"
  mdc-text-field-error-ink-color:                 "var(--sensa-lt-fault)"
  mdc-text-field-error-label-ink-color:           "var(--sensa-lt-fault)"
  mdc-text-field-outlined-idle-border-color:      "var(--sensa-lt-line)"
  mdc-text-field-outlined-hover-border-color:     "var(--sensa-lt-blue)"
  mdc-text-field-outlined-disabled-border-color:  "var(--sensa-lt-line)"

  # ---- MDC select / dropdowns --------------------------------------
  mdc-select-fill-color:                       "var(--sensa-lt-field)"
  mdc-select-disabled-fill-color:              "var(--sensa-lt-page-2)"
  mdc-select-ink-color:                        "var(--sensa-lt-text)"
  mdc-select-label-ink-color:                  "var(--sensa-lt-muted)"
  mdc-select-disabled-ink-color:               "var(--sensa-lt-faint)"
  mdc-select-idle-line-color:                  "var(--sensa-lt-line)"
  mdc-select-hover-line-color:                 "var(--sensa-lt-blue)"
  mdc-select-dropdown-icon-color:              "var(--sensa-lt-muted)"
  mdc-select-outlined-idle-border-color:       "var(--sensa-lt-line)"
  mdc-select-outlined-hover-border-color:      "var(--sensa-lt-blue)"
  mdc-select-outlined-disabled-border-color:   "var(--sensa-lt-line)"

  # ---- MDC dialog + list (dropdown popups, modal headings) ---------
  mdc-dialog-heading-ink-color:         "var(--sensa-lt-text)"
  mdc-dialog-content-ink-color:         "var(--sensa-lt-text)"
  mdc-dialog-content-background-color:  "var(--sensa-lt-card)"
  mdc-dialog-scrim-color:               "rgba(16, 25, 42, 0.32)"
  ha-dialog-surface-background:         "var(--sensa-lt-card)"
  ha-dialog-scrim-background:           "rgba(16, 25, 42, 0.32)"
  mdc-list-text-color:                  "var(--sensa-lt-text)"

  # ---- MDC menu surface (dropdown popups inside dialogs) -----------
  mdc-menu-surface-fill-color:  "var(--sensa-lt-card)"

  # ---- MDC text-on-background defaults ----------------------------
  # Many MDC components compute their default text colour from these
  # rather than from the per-component *-ink-color vars above.
  mdc-theme-text-primary-on-background:    "var(--sensa-lt-text)"
  mdc-theme-text-secondary-on-background:  "var(--sensa-lt-muted)"
  mdc-theme-text-disabled-on-background:   "var(--sensa-lt-faint)"
  mdc-theme-text-hint-on-background:       "var(--sensa-lt-muted)"
  mdc-theme-text-icon-on-background:       "var(--sensa-lt-muted)"

  # ---- Status -------------------------------------------------------
  warning-color:  "var(--sensa-lt-amber)"
  error-color:    "var(--sensa-lt-fault)"
  success-color:  "var(--sensa-lt-success)"
  info-color:     "var(--sensa-lt-blue)"

  # ---- Material Design Components ----------------------------------
  mdc-theme-primary:      "var(--sensa-lt-blue)"
  mdc-theme-secondary:    "var(--sensa-lt-blue)"
  mdc-theme-background:   "var(--sensa-lt-page)"
  mdc-theme-surface:      "var(--sensa-lt-card)"
  mdc-theme-on-primary:   "#ffffff"
  mdc-theme-on-secondary: "#ffffff"
  mdc-theme-on-surface:   "var(--sensa-lt-text)"

  # ---- Code blocks --------------------------------------------------
  code-editor-background-color:    "var(--sensa-lt-field)"
  markdown-code-background-color:  "var(--sensa-lt-page-2)"

  # ---- Lovelace page background ------------------------------------
  lovelace-background: "var(--sensa-lt-page)"
