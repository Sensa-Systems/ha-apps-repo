# Sensa Slate — Home Assistant theme bundled with Sensa Nomad.
#
# Neutral dark grey with a single cyan accent. Nothing in the
# palette carries a hue except the accent and the status colours,
# so anything coloured on screen is carrying meaning. The quiet
# default for a box that shows a lot of numbers.
#
# Architecture rule: this theme MAY define internal `--sensa-sl-*`
# palette vars for its own use, but every Sensa-generated dashboard
# and webcard MUST reference HA-standard theme variables only
# (--primary-color, --accent-color, --warning-color, --error-color,
# --success-color, --info-color, --card-background-color, etc.).
# Switching to this theme should style every Sensa surface without
# any code changes.
#
# To add another theme, copy this file, rename the top-level key and
# the internal palette block, and change only the palette values at
# the top. Nothing below that block should need editing. The installer
# (frontend.py's async_install_sensa_themes) and the picker
# (theme_catalog.py's public_theme_names) both glob `sensa-*.yaml`,
# so a new file needs no registration anywhere.

Sensa Slate:
  # ---- Internal palette (only used inside this theme) ---------------
  sensa-sl-page:        "#131619"   # body / page behind the cards
  sensa-sl-page-2:      "#191d21"   # sidebar variants, secondary surfaces
  sensa-sl-page-3:      "#23282d"   # pressed / selected / track
  sensa-sl-deep:        "#0c0f11"   # the surface below the page
  sensa-sl-card:        "#191d21"   # cards, dialogs, menus
  sensa-sl-field:       "#21262b"   # input fills
  sensa-sl-line:        "rgba(255, 255, 255, 0.12)"
  sensa-sl-line-loud:   "rgba(255, 255, 255, 0.24)"
  sensa-sl-text:        "#e6eaee"
  sensa-sl-muted:       "#a3adb6"
  sensa-sl-faint:       "#6e7982"
  sensa-sl-primary:     "#34b8c9"   # the accent: controls, links, active state
  sensa-sl-primary-2:   "#6fd6e3"   # hover / pressed, and accent text
  sensa-sl-amber:       "#d9a441"   # lights-on
  sensa-sl-warn:        "#d9a441"   # caution
  sensa-sl-heat:        "#d9673d"   # climate heating
  sensa-sl-cool:        "#34b8c9"   # climate cooling, and information
  sensa-sl-fault:       "#d76060"   # something is wrong
  sensa-sl-success:     "#4bab84"

  # ---- Primary identity --------------------------------------------
  primary-color:        "var(--sensa-sl-primary)"
  accent-color:         "var(--sensa-sl-primary)"
  dark-primary-color:   "var(--sensa-sl-primary-2)"
  light-primary-color:  "var(--sensa-sl-page-3)"

  # ---- Surfaces -----------------------------------------------------
  primary-background-color:        "var(--sensa-sl-page)"
  secondary-background-color:      "var(--sensa-sl-page-2)"
  card-background-color:           "var(--sensa-sl-card)"
  ha-card-background:              "var(--sensa-sl-card)"
  paper-card-background-color:     "var(--sensa-sl-card)"
  paper-listbox-background-color:  "var(--sensa-sl-card)"
  paper-dialog-background-color:   "var(--sensa-sl-card)"
  paper-tooltip-background-color:  "var(--sensa-sl-page-3)"
  scrollbar-thumb-color:           "var(--sensa-sl-page-3)"

  # ---- Card chrome --------------------------------------------------
  ha-card-border-radius:   "8px"
  ha-card-border-color:    "var(--sensa-sl-line)"
  ha-card-border-width:    "1px"
  ha-card-box-shadow:      "0 8px 24px rgba(0, 0, 0, 0.45)"
  ha-badge-border-radius:  "8px"

  # ---- Text ---------------------------------------------------------
  primary-text-color:     "var(--sensa-sl-text)"
  secondary-text-color:   "var(--sensa-sl-muted)"
  # The label painted ON a filled accent (sa-primary, sa-danger, the
  # selection bar). NOT the body ink: that is `primary-text-color`, one
  # letter-order away and the opposite colour. A dark theme's accents are
  # LIGHT, so the label on them is dark, not the theme's own light text.
  text-primary-color:     "#000000"
  disabled-text-color:    "var(--sensa-sl-faint)"
  # text-light-color is the text HA paints ON a primary-coloured fill
  # (raised buttons, the selection bar); text-dark-color is the body
  # ink. They are NOT "the light theme's" and "the dark theme's".
  text-light-color:       "var(--sensa-sl-text)"
  text-dark-color:        "#06171a"

  # ---- Dividers / borders ------------------------------------------
  divider-color:  "var(--sensa-sl-line)"
  outline-color:  "var(--sensa-sl-line)"

  # ---- App header ---------------------------------------------------
  app-header-background-color:       "var(--sensa-sl-card)"
  app-header-text-color:             "var(--sensa-sl-text)"
  app-header-edit-background-color:  "var(--sensa-sl-page-2)"
  app-header-selection-bar-color:    "var(--sensa-sl-primary)"

  # ---- Sidebar ------------------------------------------------------
  sidebar-background-color:           "var(--sensa-sl-card)"
  sidebar-text-color:                 "var(--sensa-sl-muted)"
  sidebar-icon-color:                 "var(--sensa-sl-muted)"
  sidebar-selected-text-color:        "var(--sensa-sl-primary-2)"
  sidebar-selected-icon-color:        "var(--sensa-sl-primary)"
  sidebar-selected-background-color:  "var(--sensa-sl-page-2)"

  # ---- State icons --------------------------------------------------
  paper-item-icon-color:         "var(--sensa-sl-muted)"
  paper-item-icon-active-color:  "var(--sensa-sl-primary)"
  state-icon-color:              "var(--sensa-sl-muted)"
  state-icon-active-color:       "var(--sensa-sl-primary)"

  # ---- Domain state colours ----------------------------------------
  state-active-color:                "var(--sensa-sl-primary)"
  state-inactive-color:              "var(--sensa-sl-faint)"
  state-binary_sensor-active-color:  "var(--sensa-sl-primary)"
  state-light-active-color:          "var(--sensa-sl-amber)"
  state-switch-active-color:         "var(--sensa-sl-primary)"
  state-climate-heat-color:          "var(--sensa-sl-heat)"
  state-climate-cool-color:          "var(--sensa-sl-cool)"

  # ---- Switch / toggle ---------------------------------------------
  switch-checked-color:           "var(--sensa-sl-primary)"
  switch-checked-button-color:    "var(--sensa-sl-primary)"
  switch-checked-track-color:     "rgba(52, 184, 201, 0.45)"
  switch-unchecked-button-color:  "#c9cdd6"
  switch-unchecked-track-color:   "var(--sensa-sl-line-loud)"

  # ---- Slider -------------------------------------------------------
  paper-slider-knob-color:         "var(--sensa-sl-primary)"
  paper-slider-knob-start-color:   "var(--sensa-sl-primary)"
  paper-slider-pin-color:          "var(--sensa-sl-primary)"
  paper-slider-active-color:       "var(--sensa-sl-primary)"
  paper-slider-secondary-color:    "color-mix(in srgb, var(--sensa-sl-primary) 40%, transparent)"
  paper-slider-container-color:    "var(--sensa-sl-page-3)"

  # ---- Legacy paper-input vars (older form widgets) ----------------
  input-background-color:    "var(--sensa-sl-field)"
  input-fill-color:          "var(--sensa-sl-field)"
  input-ink-color:           "var(--sensa-sl-text)"
  input-label-ink-color:     "var(--sensa-sl-muted)"
  input-idle-line-color:     "var(--sensa-sl-line)"
  input-hover-line-color:    "var(--sensa-sl-primary)"
  input-disabled-ink-color:  "var(--sensa-sl-faint)"

  # ---- HA design tokens (THIS is what modern HA actually reads) ----
  # Current HA frontend (config flow, profile prefs, dialogs, helpers)
  # uses webawesome `wa-input` / `wa-select` components styled via the
  # `--ha-color-*` design-token system, NOT the legacy MDC vars below.
  # The wa-input mixin reads `--ha-color-form-background` directly, so
  # without these overrides HA's stock light defaults win and inputs
  # render as near-white boxes however dark the card background is.
  # Reference: home-assistant/frontend src/resources/theme/color/semantic.globals.ts

  # Forms — input field fills (text, password, number, select)
  ha-color-form-background:           "var(--sensa-sl-field)"
  ha-color-form-background-hover:     "var(--sensa-sl-page-3)"
  ha-color-form-background-disabled:  "var(--sensa-sl-page-2)"

  # Text on the default surface
  ha-color-text-primary:    "var(--sensa-sl-text)"
  ha-color-text-secondary:  "var(--sensa-sl-muted)"
  ha-color-text-disabled:   "var(--sensa-sl-faint)"
  ha-color-text-link:       "var(--sensa-sl-primary-2)"

  # Page surfaces (cards, dialogs, sidebar variants). "lower" is the
  # surface furthest from the reader, which on a dark theme is the
  # darkest and on a light theme is the deepest tint.
  ha-color-surface-default:     "var(--sensa-sl-card)"
  ha-color-surface-low:         "var(--sensa-sl-page)"
  ha-color-surface-lower:       "var(--sensa-sl-deep)"
  ha-color-on-surface-default:  "var(--sensa-sl-text)"

  # Neutral borders
  ha-color-border-neutral-quiet:   "var(--sensa-sl-line)"
  ha-color-border-neutral-normal:  "var(--sensa-sl-line-loud)"
  ha-color-border-neutral-loud:    "rgba(255, 255, 255, 0.40)"

  # Status fills (alerts, validation states, badges)
  ha-color-fill-danger-loud-resting:   "var(--sensa-sl-fault)"
  ha-color-fill-warning-loud-resting:  "var(--sensa-sl-warn)"
  ha-color-fill-success-loud-resting:  "var(--sensa-sl-success)"
  ha-color-on-danger-quiet:            "var(--sensa-sl-fault)"
  ha-color-on-warning-quiet:           "var(--sensa-sl-warn)"
  ha-color-on-success-quiet:           "var(--sensa-sl-success)"

  # Neutral fills — dropdown item hover, chips, neutral buttons.
  # wa-dropdown-item:hover reads --wa-color-neutral-fill-normal which
  # bridges to --ha-color-fill-neutral-normal-resting in wa.globals.ts.
  # The alpha is light over a dark surface over the surface; copying the other
  # direction's values in yields an invisible dropdown hover.
  ha-color-fill-neutral-quiet-resting:   "rgba(255, 255, 255, 0.04)"
  ha-color-fill-neutral-quiet-hover:     "rgba(255, 255, 255, 0.08)"
  ha-color-fill-neutral-quiet-active:    "rgba(255, 255, 255, 0.04)"
  ha-color-fill-neutral-normal-resting:  "rgba(255, 255, 255, 0.08)"
  ha-color-fill-neutral-normal-hover:    "rgba(255, 255, 255, 0.12)"
  ha-color-fill-neutral-normal-active:   "rgba(255, 255, 255, 0.08)"
  ha-color-fill-neutral-loud-resting:    "rgba(255, 255, 255, 0.20)"
  ha-color-fill-neutral-loud-hover:      "rgba(255, 255, 255, 0.28)"
  ha-color-fill-neutral-loud-active:     "rgba(255, 255, 255, 0.20)"

  # Primary fills — selected dropdown item, primary-tinted buttons.
  # ha-dropdown-item[selected] reads --ha-color-fill-primary-quiet-
  # resting directly. A faint accent wash, so the current selection
  # reads without turning the row into a solid block of colour.
  ha-color-fill-primary-quiet-resting:   "rgba(52, 184, 201, 0.14)"
  ha-color-fill-primary-quiet-hover:     "rgba(52, 184, 201, 0.22)"
  ha-color-fill-primary-quiet-active:    "rgba(52, 184, 201, 0.14)"
  ha-color-fill-primary-normal-resting:  "rgba(52, 184, 201, 0.26)"
  ha-color-fill-primary-normal-hover:    "rgba(52, 184, 201, 0.34)"
  ha-color-fill-primary-normal-active:   "rgba(52, 184, 201, 0.26)"

  # Text colours on those fills. The `-loud` fills are solid, so text
  # on a loud primary fill is the on-accent ink, not the body ink.
  ha-color-on-neutral-quiet:   "var(--sensa-sl-muted)"
  ha-color-on-neutral-normal:  "var(--sensa-sl-text)"
  ha-color-on-neutral-loud:    "var(--sensa-sl-text)"
  ha-color-on-primary-quiet:   "var(--sensa-sl-primary-2)"
  ha-color-on-primary-normal:  "var(--sensa-sl-primary-2)"
  ha-color-on-primary-loud:    "#06171a"

  # ---- Legacy MDC text fields (older HA widgets, kept for compat) --
  mdc-text-field-fill-color:                      "var(--sensa-sl-field)"
  mdc-text-field-disabled-fill-color:             "var(--sensa-sl-page-2)"
  mdc-text-field-ink-color:                       "var(--sensa-sl-text)"
  mdc-text-field-label-ink-color:                 "var(--sensa-sl-muted)"
  mdc-text-field-disabled-ink-color:              "var(--sensa-sl-faint)"
  mdc-text-field-disabled-line-color:             "var(--sensa-sl-line)"
  mdc-text-field-idle-line-color:                 "var(--sensa-sl-line)"
  mdc-text-field-hover-line-color:                "var(--sensa-sl-primary)"
  mdc-text-field-error-line-color:                "var(--sensa-sl-fault)"
  mdc-text-field-error-ink-color:                 "var(--sensa-sl-fault)"
  mdc-text-field-error-label-ink-color:           "var(--sensa-sl-fault)"
  mdc-text-field-outlined-idle-border-color:      "var(--sensa-sl-line)"
  mdc-text-field-outlined-hover-border-color:     "var(--sensa-sl-primary)"
  mdc-text-field-outlined-disabled-border-color:  "var(--sensa-sl-line)"

  # ---- MDC select / dropdowns --------------------------------------
  mdc-select-fill-color:                       "var(--sensa-sl-field)"
  mdc-select-disabled-fill-color:              "var(--sensa-sl-page-2)"
  mdc-select-ink-color:                        "var(--sensa-sl-text)"
  mdc-select-label-ink-color:                  "var(--sensa-sl-muted)"
  mdc-select-disabled-ink-color:               "var(--sensa-sl-faint)"
  mdc-select-idle-line-color:                  "var(--sensa-sl-line)"
  mdc-select-hover-line-color:                 "var(--sensa-sl-primary)"
  mdc-select-dropdown-icon-color:              "var(--sensa-sl-muted)"
  mdc-select-outlined-idle-border-color:       "var(--sensa-sl-line)"
  mdc-select-outlined-hover-border-color:      "var(--sensa-sl-primary)"
  mdc-select-outlined-disabled-border-color:   "var(--sensa-sl-line)"

  # ---- MDC dialog + list (dropdown popups, modal headings) ---------
  mdc-dialog-heading-ink-color:         "var(--sensa-sl-text)"
  mdc-dialog-content-ink-color:         "var(--sensa-sl-text)"
  mdc-dialog-content-background-color:  "var(--sensa-sl-card)"
  mdc-dialog-scrim-color:               "rgba(0, 0, 0, 0.60)"
  ha-dialog-surface-background:         "var(--sensa-sl-card)"
  ha-dialog-scrim-background:           "rgba(0, 0, 0, 0.60)"
  mdc-list-text-color:                  "var(--sensa-sl-text)"

  # ---- MDC menu surface (dropdown popups inside dialogs) -----------
  mdc-menu-surface-fill-color:  "var(--sensa-sl-card)"

  # ---- MDC text-on-background defaults ----------------------------
  # Many MDC components compute their default text colour from these
  # rather than from the per-component *-ink-color vars above.
  mdc-theme-text-primary-on-background:    "var(--sensa-sl-text)"
  mdc-theme-text-secondary-on-background:  "var(--sensa-sl-muted)"
  mdc-theme-text-disabled-on-background:   "var(--sensa-sl-faint)"
  mdc-theme-text-hint-on-background:       "var(--sensa-sl-muted)"
  mdc-theme-text-icon-on-background:       "var(--sensa-sl-muted)"

  # ---- Status -------------------------------------------------------
  warning-color:  "var(--sensa-sl-warn)"
  error-color:    "var(--sensa-sl-fault)"
  success-color:  "var(--sensa-sl-success)"
  info-color:     "var(--sensa-sl-cool)"

  # ---- Material Design Components ----------------------------------
  mdc-theme-primary:      "var(--sensa-sl-primary)"
  mdc-theme-secondary:    "var(--sensa-sl-primary)"
  mdc-theme-background:   "var(--sensa-sl-page)"
  mdc-theme-surface:      "var(--sensa-sl-card)"
  mdc-theme-on-primary:   "#06171a"
  mdc-theme-on-secondary: "#06171a"
  mdc-theme-on-surface:   "var(--sensa-sl-text)"

  # ---- Code blocks --------------------------------------------------
  code-editor-background-color:    "var(--sensa-sl-field)"
  markdown-code-background-color:  "var(--sensa-sl-page-2)"

  # ---- Lovelace page background ------------------------------------
  lovelace-background: "var(--sensa-sl-page)"
