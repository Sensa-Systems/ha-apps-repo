run_integrity_check:
  name: Run integrity check
  description: >-
    Re-verify the integration and generated files against their recorded
    checksums and refresh sensor.sensa_nomad_integrity. Backs the Settings ->
    Diagnostics "Run Check" button. Takes no fields.

send_diagnostics:
  name: Send diagnostics now
  description: >-
    Immediately build + push the current consented Analytics & Diagnostics
    snapshot and trigger a phone-home (a one-off, rather than waiting for the next
    scheduled send). Backs the Settings -> Admin "Send now" button. Raises if no
    diagnostics category is enabled. Takes no fields.

phone_home_now:
  name: Check in now
  description: >-
    Force an immediate licence phone-home (/validate) instead of waiting for the
    next scheduled check-in, then refresh sensor.sensa_nomad_licence. Backs the
    Settings -> System licence "Check in now" button. Useful right after renewing
    or re-registering so a read-only lockout clears at once. Takes no fields.

configure_device:
  name: Configure device
  description: Save configuration (credentials, settings) for a registered device.
  fields:
    device_id:
      name: Device ID
      description: The backend device registry ID.
      required: true
      selector:
        text:
    config:
      name: Configuration
      description: Key-value configuration to merge into the device record (e.g. username, password, ssl).
      required: true
      selector:
        object:

reload_device:
  name: Reload device
  description: >-
    Re-detect what a registered gateway device (today: the Victron Cerbo GX)
    currently has connected. Adds entities for newly connected devices and
    removes the Home Assistant devices of ones that are gone. Keeps the
    device's record, credentials, scenes and layouts; nothing is removed
    and re-added.
  fields:
    device_id:
      name: Device ID
      description: The backend device registry ID.
      required: true
      selector:
        text:

reset_device_name:
  name: Reset device name
  description: >-
    Restore a registered device's display_name to the Sensa catalog
    default (classifier-generated name plus MAC tag). Useful when a
    customer renamed something and wants to undo.
  fields:
    id:
      name: Row id
      description: The Discovery sensor row id (MAC, discovery_id, device_id, or IP).
      required: true
      selector:
        text:

activate_mode:
  name: Activate mode
  description: >-
    Activate one of the 8 fixed Nomad Modes. Calls `scene.turn_on` on
    the corresponding `scene.nomad_<slug>`. Modes are latched — they
    stay active until another mode is activated.
  fields:
    mode:
      name: Mode
      description: "One of: service, sentinel, driving, parking, standby, work, movie, sleep, startup."
      required: true
      selector:
        select:
          options:
            - service
            - sentinel
            - driving
            - parking
            - standby
            - work
            - movie
            - sleep
            - startup

set_tab_order:
  name: Set tab order
  description: >-
    Persist the customer's tab order for one dashboard. Called by the panel
    after a press-and-hold drag on the tab strip. Tabs not listed keep their
    place next to the tab they are built after; omit order to reset.
  fields:
    dashboard:
      name: Dashboard
      description: Panel key, e.g. habitation, cab, mobile, intelligence, settings.
      required: true
      selector:
        text:
    order:
      name: Order
      description: Tab slugs in the desired order.
      required: false
      selector:
        object:

set_instinct_order:
  name: Set instinct order
  description: >-
    Persist the customer's order of the Instincts tiles. Called by the
    Instincts card after a Design Mode drag. Instincts not listed keep their
    catalog place; omit order to reset.
  fields:
    order:
      name: Order
      description: Instinct ids in the desired order.
      required: false
      selector:
        object:

set_routine_order:
  name: Set routine order
  description: >-
    Persist the customer's order of the Routines tiles. Called by the
    Routines card after a Design Mode drag. Routines not listed keep their
    relative order after the listed ones.
  fields:
    order:
      name: Order
      description: Routine ids in the desired order.
      required: false
      selector:
        object:

set_grid_layout:
  name: Set grid layout
  description: >-
    Persist the customer's Design Mode card layout for one tab. Called by the
    card grid after a card is dragged or resized. Omit layout to reset the tab
    to its built layout.
  fields:
    grid:
      name: Grid
      description: The grid's layout id, "<dashboard>/<tab slug>", e.g. habitation/security.
      required: true
      selector:
        text:
    layout:
      name: Layout
      description: Card key to [column, row, width, height] in grid cells.
      required: false
      selector:
        object:

set_wan_order:
  name: Set WAN order
  description: >-
    Set a Teltonika router's failover order. Called by the sensa-wan-priority-card
    after a press-and-hold drag. The order must list every enabled WAN once,
    first choice first; each gets route metric 1..n on the router.
  fields:
    device_id:
      name: Device
      description: Sensa device id of the router.
      required: true
      selector:
        text:
    order:
      name: Order
      description: Interface ids, e.g. wan, mob1s1a1, highest priority first.
      required: true
      selector:
        object:

refresh_wan:
  name: Refresh WAN order
  description: >-
    Re-read a Teltonika router's WAN order and state now. Called by the
    Internet card every few seconds while it is on screen, so a change made
    in the router's own web UI shows at once. Rate-limited per router.
  fields:
    device_id:
      name: Device
      description: Sensa device id of the router.
      required: true
      selector:
        text:

set_mode_order:
  name: Set mode order
  description: >-
    Persist the customer's display order for the Nomad Modes (the Scenes
    tabs, Home / Cab tiles and Mobile pills). Called by the sensa-mode-editor
    card after a press-and-hold drag. Unknown slugs are dropped and any mode
    not listed is appended in catalog order; omit to reset to catalog order.
  fields:
    order:
      name: Order
      description: Full list of mode slugs in the desired display order.
      required: false
      selector:
        object:

set_mode_enabled:
  name: Show or hide a scene
  description: >-
    Show or hide a scene on the tiles, pills and Scenes tabs. Drive and
    Parked can't be hidden (the instincts switch to them). Hiding the
    startup scene clears that choice.
  fields:
    mode:
      name: Mode
      description: Scene slug.
      required: true
      selector:
        text:
    enabled:
      name: Shown
      description: true to show, false to hide.
      required: true
      selector:
        boolean:

set_mode_home:
  name: Show a scene on the Habitation Home page
  description: >-
    Put a scene on, or take it off, the Habitation Home page's scene bar.
    Every scene starts on it. Separate from show / hide: a scene off Home
    can still be on the Cab and Mobile tiles.
  fields:
    mode:
      name: Mode
      description: Scene slug.
      required: true
      selector:
        text:
    home:
      name: On Home
      description: true to show on the Habitation Home page, false to take it off.
      required: true
      selector:
        boolean:

create_mode:
  name: Create scene
  description: >-
    Create a customer scene. It gets a `custom_<name>` slug, a
    `scene.nomad_<slug>` scene, an active sensor, and lands at the end of
    the Scenes tabs.
  fields:
    name:
      name: Name
      description: Display name (up to 40 characters).
      required: true
      selector:
        text:
    icon:
      name: Icon
      description: MDI icon, e.g. mdi:party-popper. Defaults to mdi:star.
      required: false
      selector:
        icon:

delete_mode:
  name: Delete scene
  description: >-
    Delete a customer-created scene and everything stored for it. Presets
    can't be deleted, only hidden.
  fields:
    mode:
      name: Mode
      description: Slug of the customer scene.
      required: true
      selector:
        text:

rename_mode:
  name: Rename scene
  description: >-
    Change a scene's display name and/or icon. Works for presets and
    customer scenes alike; the slug (and so every entity id) never changes.
  fields:
    mode:
      name: Mode
      description: Scene slug.
      required: true
      selector:
        text:
    name:
      name: Name
      description: New display name. Omit to keep.
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: New MDI icon. Omit to keep.
      required: false
      selector:
        icon:

update_mode:
  name: Update mode
  description: >-
    Persist customer overrides for one Nomad Mode and trigger scene
    YAML regeneration. Called by the sensa-mode-editor card's Save
    button.
  fields:
    mode:
      name: Mode
      description: Mode slug to update.
      required: true
      selector:
        text:
    entities:
      name: Entities
      description: "Dict of entity_id -> {state, attributes}. Omit to leave entity list unchanged."
      required: false
      selector:
        object:
    removed:
      name: Removed entities
      description: >-
        List of entity_ids the customer deleted from this mode's scene. Merged
        into the stored per-mode exclusion set (additive across saves) and
        subtracted after the per-device default merge, so a deleted entity
        stays out even when a device re-contributes it. Omit to leave
        exclusions unchanged.
      required: false
      selector:
        object:

create_light_group:
  name: Create light group
  description: >-
    Create a Light Group: a named set of lights driven as one
    `light.sensa_nomad_group_<slug>` entity. Being a real light, it can then
    be used anywhere a light can -- in a Scene, a Routine or on the Home
    layout.
  fields:
    name:
      name: Name
      description: Display name (up to 40 characters).
      required: true
      selector:
        text:
    icon:
      name: Icon
      description: MDI icon. Defaults to mdi:lightbulb-group.
      required: false
      selector:
        icon:
    members:
      name: Members
      description: >-
        List of `light.*` entity_ids to start with. Groups can't contain
        groups. Omit for an empty group.
      required: false
      selector:
        object:

delete_light_group:
  name: Delete light group
  description: >-
    Delete a light group and its entity. The member lights themselves are
    untouched.
  fields:
    group:
      name: Group
      description: Group slug.
      required: true
      selector:
        text:

rename_light_group:
  name: Rename light group
  description: >-
    Change a group's display name and/or icon. The slug (and so the entity
    id) never changes, so nothing referencing the group is orphaned.
  fields:
    group:
      name: Group
      description: Group slug.
      required: true
      selector:
        text:
    name:
      name: Name
      description: New display name. Omit to keep.
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: New MDI icon. Omit to keep.
      required: false
      selector:
        icon:

set_light_group_members:
  name: Set light group members
  description: >-
    Replace a group's membership with the given list. Always the complete
    list, not a delta.
  fields:
    group:
      name: Group
      description: Group slug.
      required: true
      selector:
        text:
    members:
      name: Members
      description: >-
        Full list of entity_ids the group should contain: `light.*`, and the
        `switch.*` of a relay channel declared as lighting.
      required: true
      selector:
        object:

set_light_group_order:
  name: Set light group order
  description: >-
    Persist the customer's display order for the light groups. Unknown slugs
    are dropped and any group left out is appended, so a stale client can
    never hide a group.
  fields:
    order:
      name: Order
      description: Group slugs in display order.
      required: false
      selector:
        object:

set_lighting_card_order:
  name: Set lighting card order
  description: >-
    Persist the order the customer dragged the Lights tab into. One list of
    card entity ids covering light groups and individual lights, because they
    share one grid. A card left out of the list is appended in the builder's
    own order, so a stale order can never hide a light.
  fields:
    order:
      name: Order
      description: Card entity ids in display order.
      required: false
      selector:
        object:

regen_modes:
  name: Regenerate modes
  description: Force a scene YAML rebuild from the current device list. Debug / support lever.

save_routine:
  name: Save routine
  description: >-
    Create or fully replace one customer-authored Routine (When / And If /
    Then Do) and regenerate routines.yaml. Called by the sensa-routines-card's
    Save button. Always sends the complete routine definition — there is no
    partial-field update.
  fields:
    routine_id:
      name: Routine ID
      description: Stable id for this routine. A new id creates a routine.
      required: true
      selector:
        text:
    name:
      name: Name
      description: Customer-facing routine name.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the generated automation is active.
      required: true
      selector:
        boolean:
    trigger:
      name: Trigger
      description: >-
        The "When" block: {kind: "time"|"device"|"service", at?, entity_id?,
        to?, above?, below?}.
      required: true
      selector:
        object:
    conditions:
      name: Conditions
      description: >-
        The "And If" list: [{entity_id, to?, above?, below?}, ...]. AND-only
        (HA's default list semantics). Omit for no extra conditions.
      required: false
      selector:
        object:
    actions:
      name: Actions
      description: >-
        The "Then Do" list, run in order. Each item is one of three shapes by
        `kind`: entity ({kind: "entity", entity_id, value}), device ({kind:
        "device", device_id, domain, value} - targets every entity of that
        domain on the device, HA's own device-targeting model), or service
        ({kind: "service", service, entity_id?, device_id?, data?} - a raw
        action call for anything the other two don't cover). A climate
        target's value is an hvac mode and may carry temperature, fan_mode,
        preset_mode and swing_mode.
      required: false
      selector:
        object:
    action:
      name: Action
      description: >-
        One "Then Do" action, the older single-action form of `actions`.
        Send one of the two.
      required: false
      selector:
        object:

delete_routine:
  name: Delete routine
  description: Remove a customer-authored routine and regenerate routines.yaml.
  fields:
    routine_id:
      name: Routine ID
      description: Routine to delete.
      required: true
      selector:
        text:

set_routine_enabled:
  name: Set routine enabled
  description: >-
    Fast enable/disable toggle for one routine from the routines list, without
    reopening the editor.
  fields:
    routine_id:
      name: Routine ID
      description: Routine to toggle.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

log:
  name: Write to the Sensa log
  description: >-
    Record a customer-facing message in the Sensa log (Intelligence -> Log tab).
    The main producer is HA automations (the curated ones plus the customer's
    own). Warning and error messages also raise an HA notification. Messages
    written here are about the VEHICLE; the Settings -> System Log is written by
    Sensa itself (backups, updates, licence) and is not open to automations.
  fields:
    message:
      name: Message
      description: The customer-facing message text.
      required: true
      selector:
        text:
          multiline: true
    level:
      name: Type
      description: >-
        Message type (default info / "Informational"). warning and error also
        raise an HA notification. `debug` is internal-only; `alarm` is the log
        mirror of the managed-alarm subsystem (prefer the raise_alarm service).
      required: false
      selector:
        select:
          options:
            - debug
            - info
            - warning
            - error
            - alarm
    context:
      name: Context
      description: Optional metadata dict attached to the entry (not shown to the customer).
      required: false
      selector:
        object:
    dedup_key:
      name: Dedup key
      description: Optional key to suppress repeats within ~24h and to give the HA notification a stable id.
      required: false
      selector:
        text:

set_automation:
  name: Set curated automation
  description: >-
    Enable/disable a Sensa-curated automation and set its config (e.g. a
    threshold). Persists the choice and regenerates the managed HA automations.
    Backs the Settings -> Automations tab toggles.
  fields:
    id:
      name: Automation id
      description: The curated automation (routine) catalog id.
      required: true
      selector:
        text:
    check:
      name: Check id
      description: >-
        Optional. Target a single check within a trigger routine (e.g. Engine
        Start, check "shore_power"). Omit to target the routine itself.
      required: false
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the routine (or the targeted check) is active.
      required: false
      selector:
        boolean:
    config:
      name: Config
      description: "Per-automation settings, e.g. {threshold: 20}."
      required: false
      selector:
        object:
    action:
      name: Action
      description: >-
        What the automation does when it fires — "warn" (a log message) or
        "alarm" (a managed alarm that re-sounds until snoozed/cancelled).
      required: false
      selector:
        select:
          options:
            - warn
            - alarm

set_person:
  name: Add or edit a person
  description: >-
    Add one of the people who live in the van, or edit an existing one. Writes
    Home Assistant's own person record, so the result is the same object HA's
    person UI would have created. Backs the Settings -> People tab. Requires a
    Sensa admin.
  fields:
    person_id:
      name: Person id
      description: >-
        Omit to add a new person. Supply it to edit an existing one. This is the
        person's Home Assistant id, not their name.
      required: false
      selector:
        text:
    name:
      name: Name
      description: The person's name, as the customer wants to see it.
      required: true
      selector:
        text:
    picture:
      name: Picture
      description: >-
        Image URL, normally one from the Sensa image library. Omit to leave the
        current picture alone; pass an empty string to remove it.
      required: false
      selector:
        text:
    device_trackers:
      name: Phones
      description: >-
        The device_tracker entities that are this person's devices. Omit to
        leave the current assignment alone.
      required: false
      selector:
        entity:
          domain: device_tracker
          multiple: true

delete_person:
  name: Remove a person
  description: >-
    Remove one of the van's people. Refuses the built-in Sensa logins (the
    support account and the kiosk tablets), which are not people. Requires a
    Sensa admin.
  fields:
    person_id:
      name: Person id
      description: The person's Home Assistant id.
      required: true
      selector:
        text:

refresh_people:
  name: Refresh people
  description: >-
    Re-read the People tab's data and make sure every GPS device on the van has
    a person. Called by the card when the tab opens, so a device paired since
    the last poll shows up straight away rather than after a refresh. Takes no
    fields.

set_driver:
  name: Set who is driving
  description: >-
    Make one person the driver: the van's GPS source becomes their device, and
    (when they came from MySensa) the MySensa session switches to them so the
    nearby search returns their saved places. Backs the photo buttons on the Cab
    Home tab. Both halves are best-effort and independent.
  fields:
    person_id:
      name: Person id
      description: The person's Home Assistant id.
      required: true
      selector:
        text:

add_person_from_member:
  name: Add a person from MySensa
  description: >-
    Add ONE of the customer's MySensa household as a person on this van, using
    the name and photo already cached on the box. Chosen from the Add-person
    dropdown, so nobody is ever overwritten and the customer picks only the
    people who actually live in this vehicle. Requires a Sensa admin.
  fields:
    member_id:
      name: MySensa member id
      description: Which member of the customer's MySensa account to add.
      required: true
      selector:
        text:

raise_alarm:
  name: Raise an alarm
  description: >-
    Raise (or refresh) a managed alarm. Unlike a log message it stays active and
    re-sounds every few minutes until the customer snoozes or cancels it. A
    re-raise of an existing key updates it in place rather than stacking a
    duplicate. The main producers are HA automations / code rules.
  fields:
    key:
      name: Key
      description: Stable identity so a re-raise updates the same alarm (e.g. low_battery).
      required: true
      selector:
        text:
    message:
      name: Message
      description: The customer-facing alarm text.
      required: true
      selector:
        text:
          multiline: true
    resound_every:
      name: Re-sound every (minutes)
      description: How often the alarm re-asserts while active (default 5).
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    title:
      name: Title
      description: >-
        Short trigger headline shown ahead of the message on the banner and the
        detail card (e.g. "Engine started"). Falls back to the message if unset.
      required: false
      selector:
        text:
    guidance:
      name: Guidance
      description: A short action line for the detail card (e.g. "Unplug shore power before driving").
      required: false
      selector:
        text:
          multiline: true
    context:
      name: Status rows
      description: >-
        Optional list of status rows for the detail card. Each item is a map with
        a "label" and either an "entity" (read live) or a static "value", plus an
        optional "icon". Example: [{label: Shore power, entity: binary_sensor.shore}].
      required: false
      selector:
        object:
    severity:
      name: Severity
      description: Colour hint for the banner and card. Defaults to critical.
      required: false
      selector:
        select:
          options:
            - warning
            - critical

snooze_alarm:
  name: Snooze an alarm
  description: Suppress an alarm's delivery for a while; it returns to active when the snooze expires.
  fields:
    key:
      name: Key
      description: The alarm key.
      required: true
      selector:
        text:
    minutes:
      name: Minutes
      description: How long to snooze (default 10).
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

cancel_alarm:
  name: Cancel an alarm
  description: Cancel a managed alarm (terminal) — stops all delivery and clears it.
  fields:
    key:
      name: Key
      description: The alarm key.
      required: true
      selector:
        text:

ignore_alarm:
  name: Ignore an alarm
  description: The customer's Ignore. Clears the alarm and keeps it quiet until the condition that raised it has cleared.
  fields:
    key:
      name: Key
      description: The alarm key.
      required: true
      selector:
        text:

schengen_set_enabled:
  name: Schengen tracking (enable or disable)
  description: >-
    Turn the Schengen 90/180 usage tracker on or off. While on, the integration
    stamps each calendar day in/out of the Schengen area from the vehicle GPS.
  fields:
    enabled:
      name: Enabled
      description: Whether tracking is active.
      required: true
      selector:
        boolean:

schengen_mark_day:
  name: Schengen, mark a day
  description: >-
    Manually mark a single calendar day as present (in the Schengen area) or
    absent. The card uses this to let the customer correct a day. A manual mark
    always wins over an automatic GPS sample.
  fields:
    date:
      name: Date
      description: The day to mark (YYYY-MM-DD).
      required: true
      selector:
        date:
    present:
      name: Present
      description: True if you were in the Schengen area that day.
      required: true
      selector:
        boolean:

schengen_set_range:
  name: Schengen, mark a trip
  description: >-
    Mark every day in a date range present or absent in one go, for backfilling
    a past trip the tracker didn't capture.
  fields:
    start:
      name: Start date
      description: First day of the range (YYYY-MM-DD).
      required: true
      selector:
        date:
    end:
      name: End date
      description: Last day of the range, inclusive (YYYY-MM-DD).
      required: true
      selector:
        date:
    present:
      name: Present
      description: True to mark the range as in the Schengen area.
      required: true
      selector:
        boolean:

schengen_clear:
  name: Schengen, clear the calendar
  description: Wipe all recorded Schengen days (keeps the enabled setting). Cannot be undone.

set_user_password:
  name: Set a login password
  description: >-
    Rotate the password for one of the customer logins (owner / hab / cab /
    mobile). Runs server-side after a Sensa-admin check, so the non-admin
    appliance owner can use it from Settings -> Admin. The Sensa support
    account is never changeable here.
  fields:
    username:
      name: Username
      description: The login to update (owner, hab, cab or mobile).
      required: true
      selector:
        text:
    password:
      name: New password
      description: At least 4 characters.
      required: true
      selector:
        text:
          type: password

set_settings_pin:
  name: Set the Settings PIN
  description: >-
    Change the PIN that unlocks the Settings dashboard for a login that is not
    already a Sensa admin. Runs server-side after a Sensa-admin check. Changing
    it ends every unlocked session, so anyone who knew the old PIN is shut out.
  fields:
    pin:
      name: New PIN
      description: 4 to 8 digits.
      required: true
      selector:
        text:
          type: password

restart_system:
  name: Restart Home Assistant
  description: >-
    Restart Home Assistant core. Server-side with system authority after a
    Sensa-admin check, so the non-admin appliance owner can trigger it.

reboot_device:
  name: Reboot the device
  description: >-
    Reboot the whole device via the Supervisor host API (Home Assistant OS /
    Supervised only). Server-side after a Sensa-admin check.

install_update:
  name: Install an update
  description: >-
    Install one update entity (device firmware). Server-side with system
    authority after a Sensa-admin check, because HA's own update.install
    refuses the non-admin appliance logins. Backs the Settings -> System
    firmware Install button.
  fields:
    entity_id:
      name: Update entity
      required: true
      selector:
        entity:
          domain: update

factory_reset:
  name: Factory reset
  description: >-
    Wipe everything the box learnt during commissioning and testing (registered
    devices, dashboards, helpers, scenes, instincts, the image library, the
    Sensa log and alarms, sensor history, cached dealer assets and EVERY
    backup, pinned ones included), then restart. Keeps the licence, the
    customer logins, Wi-Fi and the software version, so the box comes back
    activated and reachable. Backs the Settings -> System "Factory Reset"
    button. Server-side after a Sensa-admin check. Takes no fields.

complete_setup_wizard:
  name: Finish the Setup Wizard
  description: >-
    Record that the Setup Wizard is done, so it stops showing. Pressed by the
    wizard's Finish button. The wizard shows again only after a factory reset
    or on a new system. Server-side after a Sensa-admin check. Takes no fields.

set_system_config:
  name: Set system settings
  description: >-
    Update Home Assistant core configuration (units, time zone, location).
    Server-side after a Sensa-admin check, so the non-admin appliance owner
    can change them from Settings -> Admin without HA's admin pages.
  fields:
    unit_system:
      name: Unit system
      description: metric or us_customary.
      selector:
        select:
          options:
            - metric
            - us_customary
    time_zone:
      name: Time zone
      description: An IANA time zone, e.g. Europe/London.
      selector:
        text:
    country:
      name: Country
      description: An ISO 3166-1 alpha-2 country code, e.g. GB.
      selector:
        text:
    currency:
      name: Currency
      description: An ISO 4217 currency code, e.g. GBP.
      selector:
        text:
    latitude:
      name: Latitude
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Longitude
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    elevation:
      name: Elevation (m)
      selector:
        number:
          min: -500
          max: 10000
          mode: box

set_theme:
  name: Set frontend theme
  description: >-
    Set the instance-wide Home Assistant frontend theme (applies to ALL logins).
    Server-side after a Sensa-admin check, so the appliance admin can pick the
    theme for everyone from Settings -> Admin without HA's admin pages.
  fields:
    theme:
      name: Theme
      description: A theme name (e.g. Sensa Colours), or "default".
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: Optional light/dark preference for the theme.
      selector:
        select:
          options:
            - dark
            - light

run_backup:
  name: Back up now
  description: >-
    Take a backup immediately. Without `destinations` it writes to the vehicle's
    own destinations only, so an automation calling this never sends a gigabyte
    offsite unexpectedly; the Backup tab passes the buttons the customer chose
    beside "Back up now". Sensa cloud accepts one copy a week however it is
    asked, so naming it again sooner is refused with the date of the last one.
    Requires a Sensa admin.
  fields:
    name:
      name: Name
      description: What to call it. Defaults to "Manual backup".
      required: false
      selector:
        text:
    destinations:
      name: Destinations
      description: >-
        Where this one backup goes. Omit for the vehicle's own destinations.
      required: false
      selector:
        select:
          multiple: true
          options:
            - local
            - usb
            - cloud

set_backup_destination:
  name: Set scheduled backup destination
  description: >-
    Switch a destination on or off for the SCHEDULED backup (Settings -> Backup,
    the buttons in the Schedule panel). Local is the device's own storage, USB a
    plugged-in stick, Cloud the Sensa-hosted copy where the licence includes it;
    Cloud receives at most one copy a week whatever else is set. This does not
    affect "Back up now", which carries its own choice. Switching everything off
    means no scheduled backups are taken at all, which is reported in the System
    Log. Requires a Sensa admin.
  fields:
    destination:
      name: Destination
      description: Which destination to switch.
      required: true
      selector:
        select:
          options:
            - local
            - usb
            - cloud
    enabled:
      name: Enabled
      description: Whether backups should be written to it.
      required: true
      selector:
        boolean:
